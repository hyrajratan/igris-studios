<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<title>Igris Studios — Mobile apps that ship</title>
<meta name="description" content="Igris Studios: a three-engineer studio building native iOS, native Android and Flutter apps, plus the backends and AI features inside them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--page:#E8EDF3;--bg:#F6F8FB;--surface:#FFFFFF;--surface-2:#EEF2F7;--surface-3:#D9E1EB;--text:#16263B;--muted:#65758B;--line:#E2E8F0;--ink:#1F3A5F;--brand:#2E77C4;--brand-2:#E3EEFA;--accent:#F2A31B;--accent-2:#FDF0D5;--gold:#F2A31B;--ok:#1E9E62;--ok-bg:#E0F4E9;--warn:#B97A12;--warn-bg:#FBF0D8;--bad:#D6453D;--bad-bg:#FBE3E1;--info:#2E77C4;--info-bg:#E3EEFA;--shadow:0 8px 24px rgba(31,58,95,.09),0 1px 3px rgba(31,58,95,.05);--sat:50px;--sab:26px;--gh:62px;--fd:'Archivo',ui-sans-serif,system-ui,sans-serif;--fb:'Open Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--fb);background:var(--page);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
svg.i{flex:none;display:block}
small svg.i,p svg.i,.inl svg.i{display:inline-block;vertical-align:-2px}
/* ===== global bar ===== */
.gbar{position:sticky;top:0;z-index:60;height:var(--gh);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:0 20px;background:rgba(232,237,243,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.gbrand{display:flex;align-items:center;gap:9px;font:700 20px var(--fd)}
.gbrand em{font:800 10px var(--fb);font-style:normal;text-transform:uppercase;letter-spacing:.09em;background:var(--ink);color:#fff;padding:4px 7px;border-radius:6px}
.vt{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.vt button{height:38px;padding:0 16px;border-radius:10px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap}
.vt button.on{background:var(--ink);color:#fff}
.gsync{justify-self:end;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;gap:7px;align-items:center}
.gsync i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-bg)}

#appStage{min-height:calc(100vh - var(--gh));display:flex;align-items:center;justify-content:center;gap:60px;padding:16px 24px;background:radial-gradient(800px 500px at 8% 10%,rgba(46,119,196,.14),transparent 60%),radial-gradient(700px 520px at 92% 92%,rgba(242,163,27,.10),transparent 60%)}
#webStage{display:none;flex-direction:column;align-items:center;padding:14px 20px 18px;height:calc(100vh - var(--gh));gap:12px}
body.web #appStage{display:none}
body.web #webStage{display:flex}
.pitch{width:360px;flex:none}
.pitch h1{font:700 36px/1.06 var(--fd);margin-bottom:12px;letter-spacing:-.01em}
.pitch p{color:var(--muted);font-size:15px;line-height:1.55;margin-bottom:18px;font-weight:500}
.feats{list-style:none;display:grid;gap:9px;margin-bottom:22px}
.feats li{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.feats li span{width:28px;height:28px;border-radius:9px;background:var(--brand-2);color:var(--ink);display:grid;place-items:center;flex:none}
.jump-title{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:10px}
.jump{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.jump button{height:32px;padding:0 11px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:12.5px}
.jump button:hover{border-color:var(--ink)}
.jump button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hint-small{font-size:12.5px;color:var(--muted);line-height:1.5;font-weight:600}
/* phone */
.phone-wrap{width:calc(390px * var(--s,1));height:calc(844px * var(--s,1));flex:none;position:relative}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(var(--s,1));transform-origin:0 0;border-radius:60px;background:#0F1A29;padding:11px;box-shadow:0 0 0 2px #2A3A4E,0 50px 90px -30px rgba(31,58,95,.45),0 20px 40px -20px rgba(31,58,95,.3)}
.phone-inner{position:relative;width:100%;height:100%;border-radius:49px;overflow:hidden;background:var(--bg);isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:100}
.statusbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:5px 28px 0 40px;font-weight:700;font-size:15px;z-index:99;pointer-events:none;color:var(--text)}
.statusbar.light{color:#fff}
.sb-icons{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:var(--text);opacity:.85;z-index:100;pointer-events:none}
/* ===== shared primitives ===== */
.btn{height:52px;border-radius:16px;font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;flex:none;text-align:center;transition:transform .1s,opacity .2s,background .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.38;pointer-events:none}
.btn-dark{background:var(--ink);color:#fff}
.btn-brand{background:var(--brand);color:#fff}
.btn-accent{background:var(--accent);color:#fff}
.btn-ghost{background:var(--surface-2);color:var(--text)}
.btn-line{background:var(--surface);border:1.5px solid var(--line)}
.btn-bad{background:var(--bad-bg);color:var(--bad)}
.btn.sm{height:40px;border-radius:12px;font-size:13.5px;width:auto;padding:0 14px}
.btn-link{font-weight:700;color:var(--muted);font-size:14px;padding:12px;width:100%;text-align:center}
.chip{height:36px;padding:0 13px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px 4px}
.chips::-webkit-scrollbar,.scroll::-webkit-scrollbar,.hs::-webkit-scrollbar,.msheet::-webkit-scrollbar,.dates::-webkit-scrollbar,.pdbody::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:8px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}.p-mute{background:var(--surface-2);color:var(--muted)}.p-brand{background:var(--brand-2);color:var(--ink)}
.switch{width:46px;height:27px;border-radius:20px;background:var(--surface-3);position:relative;transition:background .25s;flex:none}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .25s}
.switch.on{background:var(--brand)}
.switch.on::after{left:22px}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;margin-bottom:14px;flex:none}
.seg button{flex:1;height:36px;border-radius:10px;font-weight:700;color:var(--muted);font-size:13.5px;text-align:center}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea,.inp{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 15px;font-size:15px;font-weight:600;outline:none}
.field textarea{height:84px;padding:12px 15px;resize:none}
.field input:focus,.inp:focus,.field textarea:focus{border-color:var(--brand)}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;flex:none}
.stars{display:inline-flex;gap:1px;color:var(--gold);vertical-align:-2px}
.rt{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--text)}
.rt svg{color:var(--gold)}
.rt small{color:var(--muted);font-weight:600}
.price{font-weight:800}
.mrp{color:var(--muted);text-decoration:line-through;font-weight:600;font-size:.86em}
.off{color:var(--brand);font-weight:800;font-size:.86em}
.stepper{display:inline-flex;align-items:center;border-radius:12px;background:var(--ink);color:#fff;height:36px;flex:none}
.stepper button{width:34px;height:36px;display:grid;place-items:center}
.stepper b{min-width:20px;text-align:center;font-size:14px}
.addb{height:36px;padding:0 14px;border-radius:12px;border:1.5px solid var(--brand);color:var(--brand);font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:5px;flex:none;background:var(--surface)}
.addb:disabled{border-color:var(--line);color:var(--muted)}
.empty{text-align:center;padding:40px 10px;color:var(--muted);font-weight:600}
.empty .ei{width:64px;height:64px;border-radius:20px;margin:0 auto 12px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.sumline{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;color:var(--muted);padding:5px 0}
.sumline b{color:var(--text);text-align:right}
.sumline.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:16px;color:var(--text);font-weight:800}
.sumline.disc b{color:var(--ok)}
.tl{position:relative;padding-left:4px}
.tl .st{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl .st:last-child{padding-bottom:0}
.tl .st::before{content:'';position:absolute;left:11px;top:24px;bottom:-2px;width:2px;background:var(--surface-3)}
.tl .st.done::before{background:var(--brand)}
.tl .st:last-child::before{display:none}
.tl .dot{width:24px;height:24px;border-radius:50%;background:var(--surface-3);color:#fff;display:grid;place-items:center;flex:none;position:relative;z-index:1}
.tl .st.done .dot{background:var(--brand)}
.tl .st.cur .dot{box-shadow:0 0 0 5px var(--brand-2)}
.tl b{display:block;font-size:14px}
.tl small{font-size:12.5px;color:var(--muted);font-weight:600}
.tl .st:not(.done) b{color:var(--muted)}
@keyframes inF{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
@keyframes inB{from{transform:translateX(-26px);opacity:0}to{transform:none;opacity:1}}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes inUp{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite;display:inline-block}
.spinner.dk{border-color:var(--surface-3);border-top-color:var(--brand);width:44px;height:44px;border-width:4px}
/* ===== APP ===== */
#app{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.in-fwd{animation:inF .34s cubic-bezier(.2,.8,.2,1)}.in-back{animation:inB .34s cubic-bezier(.2,.8,.2,1)}.in-fade{animation:inFade .3s ease}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);flex:none;position:relative}
.ib.glass{background:rgba(255,255,255,.92);border:0;box-shadow:var(--shadow)}
.ib .bd{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.ib .nb{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:0 20px 24px}
.topbar{display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 8px) 16px 12px;flex:none}
.topbar h2{flex:1;font-size:17px;font-weight:800}
.tb{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(var(--sat) + 12px) 20px 12px;flex:none}
.tb h1{font:700 28px var(--fd)}
.sec{display:flex;align-items:baseline;justify-content:space-between;font:700 19px var(--fd);margin:22px 2px 12px}
.sec small{font:700 13px var(--fb);color:var(--brand);cursor:pointer}
.card{background:var(--surface);border-radius:20px;padding:16px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border:0}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.ic{width:40px;height:40px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink)}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(var(--sab) + 2px);flex:none}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.tabbar .ti{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.tabbar .on{color:var(--text)}
.tabbar .on .ti{background:var(--ink);color:#fff}
/* login */
.login{flex:1;display:flex;flex-direction:column;background:var(--ink);color:#fff;min-height:0}
.lhero{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.lhero>svg{position:absolute;inset:0;width:100%;height:100%}
.lw{position:relative;text-align:center}
.lw b{display:block;font:700 44px var(--fd);margin-top:10px}
.lw span{font-weight:600;opacity:.75}
.lpanel{background:var(--bg);color:var(--text);border-radius:30px 30px 0 0;padding:22px 20px calc(var(--sab) + 12px)}
.lpanel h2{font:700 25px var(--fd);margin-bottom:4px}
.lpanel .lead{color:var(--muted);font-weight:600;font-size:14px;margin-bottom:16px;line-height:1.45}
.phin{display:flex;gap:8px;margin-bottom:12px}
.phin .cc{height:54px;padding:0 14px;border-radius:15px;background:var(--surface);border:1.5px solid var(--line);font-weight:800;display:flex;align-items:center;flex:none;font-size:15px}
.phin input{flex:1;min-width:0;height:54px;border-radius:15px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;font-size:18px;font-weight:700;outline:none;letter-spacing:.03em}
.phin input:focus{border-color:var(--brand)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;font-weight:600;margin:14px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.social3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.social3 .btn{height:46px;font-size:13.5px}
.legal{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.5;text-align:center;font-weight:500}
.otp{display:flex;gap:8px;margin-bottom:14px}
.otp input{width:100%;min-width:0;height:58px;border-radius:15px;border:2px solid var(--line);background:var(--surface);text-align:center;font-size:24px;font-weight:800;outline:none}
.otp input:focus{border-color:var(--brand)}
.otp input.ok{border-color:var(--ok)}
.tip{display:flex;gap:9px;align-items:center;padding:11px 13px;border-radius:13px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--muted);margin-bottom:14px}
.foot{padding:10px 20px calc(var(--sab) + 12px);flex:none;background:var(--bg);border-top:1px solid var(--line)}
.foot .btn{justify-content:space-between;padding:0 20px}
.foot .btn.c{justify-content:center}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);margin-bottom:8px;width:100%;font-weight:700;font-size:14.5px;text-align:left}
.opt.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand-2) 45%,var(--surface))}
.opt .tx{flex:1;min-width:0}
.opt small{display:block;font-size:12px;color:var(--muted);font-weight:600;line-height:1.4}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface-3);display:grid;place-items:center;flex:none}
.opt.on .radio{border-color:var(--brand);background:var(--brand);color:#fff}
.slabel{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:16px 2px 8px}
.confirm{flex:1;display:flex;flex-direction:column;align-items:center;padding:calc(var(--sat) + 36px) 24px 0;text-align:center;overflow-y:auto}
.confirm .ok{width:88px;height:88px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;animation:pop .6s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 0 12px var(--brand-2)}
.confirm h1{font:700 28px var(--fd);margin:24px 0 6px}
.confirm p{color:var(--muted);font-weight:600;line-height:1.5}
.ticket{width:100%;margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;text-align:left}
.prof{display:flex;align-items:center;gap:14px;padding:4px 0 16px}
.prof b{display:block;font:700 22px var(--fd)}
.prof small{color:var(--muted);font-weight:600;font-size:13px}
.mgroup{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:2px 14px;margin-bottom:6px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;cursor:pointer;text-align:left}
.mrow:last-child{border:0}
.mrow .lbl{flex:1;font-weight:700;font-size:14.5px;min-width:0}
.mrow .lbl small{display:block;font-size:12px;color:var(--muted);font-weight:600;line-height:1.4}
.mrow .val{font-size:13px;color:var(--muted);font-weight:700}
.mrow.danger{color:var(--bad)}
.secure{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;background:var(--brand-2);margin-bottom:12px}
.secure b{display:block;font-size:14.5px}
.secure small{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.45;display:block}
/* app overlays */
#aToast,#wToast{position:absolute;left:50%;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:15px;opacity:0;transition:opacity .25s,transform .3s;z-index:95;font-weight:700;font-size:13.5px;max-width:88%;width:max-content;display:flex;gap:9px;align-items:center;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#aToast{bottom:calc(var(--sab) + 96px)}
#wToast{bottom:24px}
#aToast.show,#wToast.show{opacity:1;transform:translate(-50%,0)}
#aToast svg,#wToast svg{color:#8EC1F5;flex:none}
#aSheet{position:absolute;inset:0;z-index:80;pointer-events:none}
#aSheet.open{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(12,22,38,.5);opacity:0;transition:opacity .3s}
#aSheet.open .backdrop,#wModal.open .backdrop{opacity:1}
.msheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px calc(var(--sab) + 16px);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);max-height:90%;overflow-y:auto;scrollbar-width:none}
#aSheet.open .msheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto 14px}
.sh-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.sh-head>div{flex:1}
.sh-head h3{font:700 22px var(--fd)}
.sh-head p{font-size:13.5px;color:var(--muted);font-weight:600;margin-top:4px;line-height:1.45}
.xb{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.payproc{text-align:center;padding:20px 0 10px}
.payproc b{display:block;font:700 21px var(--fd);margin:16px 0 4px}
.payproc small{color:var(--muted);font-weight:600;font-size:13px}
#aBanner{position:absolute;top:calc(var(--sat) + 6px);left:10px;right:10px;z-index:85;transform:translateY(calc(-100% - var(--sat) - 40px));transition:transform .45s cubic-bezier(.2,.9,.2,1)}
#aBanner.show{transform:none}
.bn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 30px rgba(0,0,0,.18);cursor:pointer}
.bn .bt{flex:1;min-width:0}
.bn b{display:block;font-size:14px}
.bn small{display:block;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ===== real phones ===== */
@media (max-width:1000px){#appStage{flex-direction:column;gap:24px}.pitch{width:min(560px,100%)}}
@media (max-width:520px){
  :root{--gh:54px;--sat:12px;--sab:max(env(safe-area-inset-bottom),10px)}
  .gbar{grid-template-columns:auto 1fr;padding:0 10px;gap:10px}
  .gbrand span,.gbrand em,.gsync{display:none}
  .vt{justify-self:end}
  .vt button{height:34px;padding:0 11px;font-size:13px}
  #appStage{padding:0;gap:0;display:block;background:var(--bg);min-height:0}
  .pitch{display:none}
  .phone-wrap{width:100vw;height:calc(100dvh - var(--gh))}
  .phone{width:100%;height:100%;transform:none;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .phone-inner{border-radius:0}
  .island,.statusbar,.home-ind{display:none}
  #webStage{padding:0;gap:0;height:calc(100dvh - var(--gh))}
  .wtool{padding:8px 10px;background:var(--page)}
  .wtool .dev,.wtool .lbl{display:none}
  .bframe{border-radius:0;box-shadow:none}
  .bdots,.bnav.rf{display:none}
  input,select,textarea{font-size:16px!important}
}
/* ===== shell ===== */
.muted{color:var(--muted)}
.gbar{background:var(--ink);border-bottom:0}
.gbrand img{height:34px;width:auto;display:block}
.vt{background:rgba(255,255,255,.1);border-color:transparent;box-shadow:none}
.vt button{color:#C6D6E8}
.vt button.on{background:#fff;color:var(--ink)}
.gsync{color:#C6D6E8}
#pitchStage{height:calc(100vh - var(--gh));overflow-y:auto;background:#fff}
#appStage{display:none}
body.vapp #appStage{display:flex}
body.vapp #pitchStage{display:none}
/* ===== app concept ===== */
.sec{font-size:20px}
.tb h1{font-size:28px;letter-spacing:-.01em}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px}
.sbar{display:flex;align-items:center;gap:10px;height:50px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);padding:0 14px;width:100%;color:var(--muted);font-weight:600;font-size:14.5px;text-align:left}
.sbar input{flex:1;border:0;outline:none;background:none;font-size:15px;font-weight:600;color:var(--text);min-width:0}
.lw b{font-weight:800;font-size:44px;letter-spacing:-.02em}
.lw span{display:block;max-width:250px;margin:6px auto 0;line-height:1.45}
.lpanel h2{font-weight:700;font-size:25px}
.offb{display:flex;gap:8px;align-items:center;padding:8px 20px;background:var(--warn-bg);color:#7A5310;font-size:12px;font-weight:700;flex:none;line-height:1.35}
.sitec{display:flex;gap:10px;align-items:center;text-align:left;min-width:0}
.sitec small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.sitec b{display:flex;gap:4px;align-items:center;font:700 17px var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.catb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;text-align:center}
.catb span{width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;line-height:0;border:1px solid var(--line)}
.catb svg{width:100%;height:100%}
.rate{flex:none;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:128px}
.rate small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.rate b{font:700 17px var(--fd)}
.rate em{font-style:normal;font-size:11.5px;font-weight:800;margin-left:4px}
.up{color:var(--bad)}.dn{color:var(--ok)}
.prow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border:0}
.part{width:62px;height:62px;border-radius:16px;overflow:hidden;line-height:0;flex:none;border:1px solid var(--line)}
.part svg{width:100%;height:100%}
.prow .tx{flex:1;min-width:0;text-align:left}
.prow .tx b{display:block;font-size:14.5px;line-height:1.25}
.prow .tx small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.prow .tx em{font-style:normal;font:700 15px var(--fd);display:block;margin-top:3px}
.prow .tx em i{font:600 11.5px var(--fb);font-style:normal;color:var(--muted)}
.addq{height:36px;padding:0 14px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;flex:none}
.qs{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:12px;padding:3px;flex:none}
.qs button{width:30px;height:30px;border-radius:10px;background:var(--surface);display:grid;place-items:center;box-shadow:0 1px 2px rgba(31,58,95,.1)}
.qs b{min-width:54px;text-align:center;font-size:12.5px;font-weight:800}
.qs.lg{padding:4px}.qs.lg button{width:42px;height:42px;border-radius:12px}.qs.lg b{min-width:96px;font-size:16px}
.phero{height:230px;flex:none;position:relative;line-height:0}
.phero svg{width:100%;height:100%}
.phero .ib{position:absolute;top:calc(var(--sat) + 6px);left:16px}
.ldm{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.ldm .r{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:7px;gap:8px}
.ldb{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.ldb i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv2 div{padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.kv2 small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.kv2 b{font-size:13.5px}
.pbar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(var(--sab) + 10px);background:linear-gradient(to top,var(--bg) 78%,transparent);z-index:5;display:flex;gap:10px;align-items:center}
.pbar .tt{flex:none}
.pbar .tt small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.pbar .tt b{font:700 21px var(--fd)}
.wa{background:#1FA855;color:#fff}
.wam{background:#E7F6D8;border-radius:4px 16px 16px 16px;padding:12px 14px;font-size:13.5px;line-height:1.55;font-weight:500;white-space:pre-line;margin-bottom:14px;color:#17301A}
.ocard{display:block;width:100%;text-align:left;border-radius:20px;padding:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.ocard.dk{background:var(--ink);color:#fff;border-color:var(--ink)}
.ocard .top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.ocard b{font-size:14.5px}
.ocard small{display:block;font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.45}
.ocard.dk small{color:#C6D6E8}
.steps4{display:flex;gap:4px;margin-top:10px}
.steps4 i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.2)}
.steps4 i.on{background:var(--accent)}
.map{height:226px;border-radius:22px;overflow:hidden;background:#DDE7F0;position:relative;line-height:0;margin-bottom:12px;flex:none}
.map svg{width:100%;height:100%}
.map .eta{position:absolute;left:12px;top:12px;background:var(--surface);border-radius:12px;padding:8px 12px;line-height:1.3;box-shadow:var(--shadow)}
.map .eta small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.map .eta b{font:700 17px var(--fd)}
.tls{position:relative;padding-left:26px}
.tls div{position:relative;padding:0 0 14px;font-size:13.5px;font-weight:700;color:var(--muted)}
.tls div small{display:block;font-size:12px;font-weight:600}
.tls div::before{content:'';position:absolute;left:-26px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--surface-3);border:3px solid var(--bg)}
.tls div::after{content:'';position:absolute;left:-20px;top:18px;bottom:-2px;width:2px;background:var(--surface-3)}
.tls div:last-child::after{display:none}
.tls div.on{color:var(--text)}
.tls div.on::before{background:var(--ok)}
.tls div.now::before{background:var(--accent);box-shadow:0 0 0 4px var(--accent-2)}
.codeb{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--accent-2);margin-bottom:12px}
.codeb b{font:800 28px var(--fd);letter-spacing:.12em}
.codeb small{display:block;font-size:12.5px;font-weight:600;color:#7A5310;line-height:1.4}
.est{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.est .field{margin:0}
.est input{text-align:center}
.cgrp{display:flex;flex-wrap:wrap;gap:8px}
.promo{display:flex;gap:12px;align-items:center;border-radius:20px;padding:14px;background:var(--ink);color:#fff;width:100%;text-align:left;margin-top:14px}
.promo .pi{width:44px;height:44px;border-radius:14px;background:rgba(142,193,245,.18);color:#8EC1F5;display:grid;place-items:center;flex:none}
.promo b{display:block;font:700 16.5px var(--fd)}
.promo small{font-size:12.5px;font-weight:600;color:#C6D6E8;line-height:1.4;display:block}
.cred{border-radius:18px;padding:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.cats{grid-template-columns:repeat(4,1fr);gap:10px}
[hidden]{display:none!important}
.tabbar.t5{grid-template-columns:repeat(5,1fr)}
.tabbar.t5 .ti{width:46px}
.rolep{height:36px;padding:0 12px 0 10px;border-radius:12px;background:var(--brand-2);color:var(--ink);font-weight:800;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;flex:none;position:relative;white-space:nowrap}
.rolep .bd{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:#1F3A5F;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.ib .bd[data-rb]{background:var(--accent);color:#1F3A5F}
span.sitec small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
span.sitec b{display:block}
.rseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);border-radius:14px;padding:5px;margin-bottom:18px}
.rseg button{height:40px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;position:relative}
.rseg button.on{background:var(--ink);color:#fff}
.rseg i{position:absolute;top:-6px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:#1F3A5F;font:800 10.5px var(--fb);display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi>*{padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left}
.kpi small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.kpi b{font:800 22px var(--fd);letter-spacing:-.01em}
.kpi .hot{background:var(--accent-2);border-color:transparent}
.kpi .hot small{color:#7A5310}
.stk .tx .pill{margin-top:5px}
.stk.off .part,.stk.off .tx b,.stk.off .tx small{opacity:.45}
.addq.gh{background:var(--surface-2);color:var(--text);padding:0 10px;font-size:12.5px}
.opt.dis{opacity:.45;cursor:not-allowed}
.opt .pill{flex:none}
.cred.rw{display:flex;align-items:center;gap:12px}
.cred.rw .pi{width:44px;height:44px;border-radius:14px;background:var(--accent-2);color:#B77400;display:grid;place-items:center;flex:none}
.cred.rw>div{flex:1}
.cred.rw small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.cred.rw b{font:800 24px var(--fd)}
.legal .lk{display:block;margin:8px auto 0;font-weight:800;color:var(--brand);font-size:12.5px}
.dn4{text-align:center;padding-top:18px}
.dn4 .ok{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.dn4 h1{font:800 28px var(--fd)}
.dn4 p{color:var(--muted);font-weight:600;font-size:14px;line-height:1.5;margin:6px auto 0;max-width:280px}
.row .ib+.ib{margin-left:-4px}
/* ===== pitch page ===== */
.pg{color:var(--text)}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
.hero{background:linear-gradient(315deg,#234C7D 0 24%,transparent 24.1%),var(--ink);color:#fff;border-bottom:6px solid var(--brand)}

.box{background:#F3F6FA;border:1px solid #DCE4EE;border-radius:16px;padding:22px}
.wbox2{background:#fff;border:1px solid #DCE4EE;border-radius:16px;padding:22px}

.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:26px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
.card3 h3{font:700 18px var(--fd);color:var(--ink);margin-bottom:6px}

.tm .ln{font-size:13px;color:var(--muted);margin:3px 0 10px}
.tm p{font-size:14.5px;line-height:1.55;color:#33445A}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chips2 span{font-size:12px;font-weight:700;padding:4px 9px;border-radius:7px;background:#E3EAF3;color:var(--ink)}

.wk .nt{font-size:13px;font-weight:700;color:var(--ink);margin-top:12px}

.wk2{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}
.wk2 img{width:100%;border-radius:12px;border:1px solid #DCE4EE;display:block}
.proc{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-top:26px;padding:24px}
.proc b{display:block;font:700 22px var(--fd);color:var(--brand)}
.proc h3{font:700 15px var(--fd);color:var(--ink);margin:4px 0 6px}
.proc p{font-size:13.5px;line-height:1.5;color:var(--muted)}
.ctab{background:var(--ink);color:#fff;border-radius:18px;padding:36px;margin-top:64px}
.ctab h2{font:800 clamp(26px,3.4vw,34px)/1.1 var(--fd);letter-spacing:-.02em}
.ctab p{font-size:16px;line-height:1.6;color:#DCE6F2;max-width:720px;margin-top:12px}
.ctab .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.foot2{text-align:center;padding:48px 20px 60px;font-size:13px;color:var(--muted)}
.foot2 img{height:40px;display:block;margin:0 auto 12px}
.foot2 b{color:var(--ink)}
.foot2 small{display:block;margin-top:10px;font-size:12px;max-width:560px;margin-left:auto;margin-right:auto;line-height:1.5}
.gl{display:grid;gap:7px}
.gl div{display:grid;grid-template-columns:86px 1fr;font-size:14px;gap:8px}
.gl b{color:var(--ink)}
.gl span{color:var(--muted)}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;margin-top:22px;align-items:start}
.two p{font-size:16px;line-height:1.6;color:#33445A;margin-bottom:12px}
.two li{font-size:15px;line-height:1.7;list-style:none}
.two li::before{content:'•';color:var(--brand);font-weight:800;margin-right:8px}
@media (max-width:1180px){.gsync{display:none}}
@media (max-width:900px){.concept,.two,.wk2,.wkc{grid-template-columns:1fr}.wkc .shots img{height:300px}.g3,.g4{grid-template-columns:1fr 1fr}.req>div{grid-template-columns:1fr;gap:6px}.req .hd{display:none}.proc{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr;gap:20px}.hero{background:linear-gradient(315deg,#234C7D 0 16%,transparent 16.1%),var(--ink)}}
@media (max-width:700px){.vt .xl{display:none}}
@media (max-width:560px){.wrap{padding:0 18px}.hero .wrap{padding-top:44px;padding-bottom:52px}.hero p{font-size:16px}.g3,.g4,.g2,.proc{grid-template-columns:1fr}.tm{grid-template-columns:72px 1fr;gap:14px}.tm img{width:72px;height:72px}.wk .wh{grid-template-columns:56px 1fr;gap:12px}.wk .wh>img{width:56px;height:56px;border-radius:14px}.shots img{height:230px}.psec{padding-top:48px}.ctab{padding:26px 20px}.box,.wbox2{padding:18px}#pitchStage{height:calc(100dvh - var(--gh))}.gbrand img{height:24px}.hb{width:100%;justify-content:center}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

  const proc = `<section class="psec"><div class="wrap"><div class="ey">How we work</div><h2>${P ? 'From first call to a build on your phone' : 'From first message to store listing'}</h2><div class="wbox2 proc">${[['Scope call', '30 minutes. We map features, pick the platform and flag the risky parts early.'], [P ? 'Written proposal' : 'Fixed proposal', 'Milestones, deliverables and price in writing before any code.'], ['Build sprints', 'Two-week sprints, an installable build every week, no silent stretches.'], ['QA on devices', 'Real hardware, not just simulators. Offline, edge cases, low-end phones.'], ['Launch & support', 'Store submission, review responses, 30 days of bug fixes included.']].map(([a, b], i) => `<div><b>0${i + 1}</b><h3>${a}</h3><p>${b}</p></div>`).join('')}</div></div></section>`;
  const btn = CONTACT.email ? `<a class="hb pr" href="mailto:${esc(CONTACT.email)}">${ic('mail', 18)} ${esc(CONTACT.email)}</a>` : CONTACT.url ? `<a class="hb pr" href="${esc(CONTACT.url)}" target="_blank" rel="noopener">${ic('send', 18)} ${esc(CONTACT.label)}</a>` : `<span class="hb gh">${ic('send', 18)} ${esc(CONTACT.label)}</span>`;
  const cta = `<div class="wrap"><div class="ctab"><h2>${P ? `Start with a 30-minute scope call` : 'Tell us what you are building.'}</h2><p>${P ? `Tell us what is next on the roadmap for the customer app and Crust Partner, or what is slowing releases down today. We come back within 24 hours with an honest scope: what it takes, what it costs and what we would cut. If it is not a fit for us, we will say so.` : 'Send the job description and we will come back with an honest scope: what it takes, what it costs, what we would cut, and whether native, Flutter, or an AI feature at all, is the right call. If it is not a fit for us, we will say so.'}</p><div class="cta">${P ? `<button class="hb bl" data-v="app">${ic('mobile', 18)} Open the three-app concept</button>` : ''}${btn}</div><div class="tagr">${['Free scope review', 'Weekly builds', 'Code is yours', '30-day post-launch fixes'].map(x => `<span>${x}</span>`).join('')}</div></div></div>`;
  const foot = `<div class="foot2"><img src="${IMG.logoN}" alt="Igris Studios"><b>IGRIS STUDIOS</b> | iOS • Android • Cross-Platform • AI${P ? `<small>The app concept is an independent demo made by Igris Studios for this proposal. It is not a ${c} product and is not affiliated with or endorsed by ${c}. App names mentioned belong to their owners.</small>` : ''}</div>`;
  $('#pg').innerHTML = hero + stats + concept + first + reqs + (P ? why + eng + who : who + caps) + team + work + proc + (P ? '' : eng) + cta + foot;
}

/* ---------- shell ---------- */
function setView(v, quiet) {
  if (!PITCH) v = 'pitch';
  S.view = v; document.body.classList.toggle('vapp', v === 'app');
  $$('#vt button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  try { history.replaceState(null, '', v === 'app' ? '#app' : '#studio'); } catch (e) { }
  if (v === 'app') { fitPhone(); if (!current) go(roleHome()); flush(); } else if (!quiet) $('#pitchStage').scrollTop = 0;
}
document.title = PITCH ? `Igris Studios × ${PITCH.client} — ${PITCH.role}` : 'Igris Studios — Mobile apps that ship';
$('#gbrand').innerHTML = `<img src="${IMG.logoW}" alt="Igris Studios">`;
if (PITCH) { $('#vt').innerHTML = `<button data-v="pitch">${ic('file', 17)}<span>Proposal</span></button><button data-v="app">${ic('mobile', 17)}<span>App<span class="xl"> concept</span></span></button>`; $('#gsync').innerHTML = `<i></i>Prepared for ${esc(PITCH.client)} · ${esc(PITCH.role)}`; }
else { $('#vt').style.display = 'none'; $('#gsync').textContent = 'iOS • Android • Cross-Platform • AI'; }
document.addEventListener('click', e => {
  const v = e.target.closest('[data-v]'); if (v) { setView(v.dataset.v); return; }
  const sc = e.target.closest('[data-sc]'); if (sc) { e.preventDefault(); const t = document.getElementById(sc.dataset.sc); t && t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
});
buildPitch(); buildAside(); fitPhone(); tick(); setInterval(tick, 15000);
window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(fitPhone, 120); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
function fromHash() { setView((location.hash || '').toLowerCase() === '#app' ? 'app' : 'pitch', true); }
fromHash();
window.addEventListener('hashchange', fromHash);
</script>
</body>
